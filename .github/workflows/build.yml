name: Build APK and publish to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Android
  build:
    runs-on: ubuntu-latest

    # Exposed at job level so the `if:` on the deploy step can see it.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Unpack the source zip
        # The repo holds only this workflow and the zip. Everything else —
        # lib/, site/, tool/, pubspec.yaml — lives inside the zip.
        # -n never overwrites, so a file added to the repo directly wins.
        run: |
          unzip -n tv-remote-repo.zip
          echo "--- files now present ---"
          ls -R lib site tool

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Guard against building the wrong app
        # Without lib/, flutter create silently generates a demo counter app
        # and the build goes green with completely the wrong APK.
        run: |
          test -f lib/main.dart || { echo "::error::lib/main.dart missing"; exit 1; }
          grep -q "TvRemoteApp" lib/main.dart || { echo "::error::lib/main.dart is not the TV remote source"; exit 1; }
          test -f site/index.html || { echo "::error::site/index.html missing"; exit 1; }
          test -f tool/patch_android.py || { echo "::error::tool/patch_android.py missing"; exit 1; }
          echo "Source looks right."

      - name: Generate the android/ project
        run: flutter create --platforms=android --org pk.bilal --project-name tv_remote .

      - name: Drop the placeholder test
        # flutter create writes a test that references MyApp; this app's
        # root widget is TvRemoteApp, so the test would fail to compile.
        run: rm -f test/widget_test.dart

      - name: Patch the Android manifest
        # Adds INTERNET + Wi-Fi permissions and allows cleartext traffic.
        # Without this the release APK cannot reach the TV at all.
        run: python3 tool/patch_android.py

      - name: Fetch packages
        run: flutter pub get

      - name: Dump the generated client certificate
        # The TV rejects the app's TLS handshake with alert 47 while accepting
        # a .NET-made certificate, so this prints what basic_utils actually
        # produces. Never blocks the build.
        continue-on-error: true
        run: |
          mkdir -p diag
          dart run tool/dump_cert.dart 2>&1 | tee diag/client-cert.txt || true
          echo "--- structure summary ---"
          sed -n '/STRUCTURE/,/RSA NUMBERS/p' diag/client-cert.txt || true

      - name: Upload the certificate dump
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cert-diagnostic
          path: diag/
          if-no-files-found: warn

      - name: Analyze
        # Does not block the build — read the log, then fix and push again.
        continue-on-error: true
        run: flutter analyze

      - name: Show the toolchain versions
        # When a build that worked last week fails this week, it is almost
        # always the toolchain moving under us. Printing this costs seconds
        # and turns "exit code 1" into an answer.
        continue-on-error: true
        run: |
          java -version 2>&1
          flutter --version
          echo "--- gradle wrapper ---"
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo "--- android gradle plugin ---"
          grep -r "com.android.application\|agp_version\|com.android.tools.build" android/*.gradle* android/**/*.gradle* 2>/dev/null | head -5 || true

      - name: Build release APKs
        # --split-per-abi keeps each file well under Cloudflare's 25 MB limit.
        #
        # pipefail matters: without it, tee's exit code wins and a failed
        # build reports success.
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build-android.log

      - name: Keep the build log whatever happened
        # So a failure can be read without scrolling through the web UI:
        # download "android-build-log" from this run's Artifacts.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-android.log
          if-no-files-found: warn

      - name: Assemble the download site
        run: |
          set -e
          mkdir -p site_out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   site_out/tv-remote.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk site_out/tv-remote-32bit.apk
          SIZE=$(du -h site_out/tv-remote.apk | cut -f1)
          BUILT=$(date -u '+%d %b %Y, %H:%M UTC')
          sed -e "s|__BUILD_DATE__|$BUILT|g" \
              -e "s|__BUILD_NUMBER__|${{ github.run_number }}|g" \
              -e "s|__COMMIT__|${GITHUB_SHA:0:7}|g" \
              -e "s|__SIZE__|$SIZE|g" \
              site/index.html > site_out/index.html
          ls -lh site_out

      - name: Fail if the APK is too big for Cloudflare Pages
        run: |
          BYTES=$(stat -c%s site_out/tv-remote.apk)
          echo "APK is $BYTES bytes"
          if [ "$BYTES" -gt 26214400 ]; then
            echo "::error::APK exceeds the Cloudflare Pages 25 MB per-file limit."
            exit 1
          fi

      - name: Upload the APKs to this run
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish to Cloudflare Pages
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site_out --project-name=tv-remote --branch=main

      - name: Say where it went
        if: env.CF_TOKEN == ''
        run: echo "::notice::Cloudflare secrets not set. Download the APK from this run's Artifacts section instead."

  # ---------------------------------------------------------------- iPhone
  #
  # A separate job so a macOS failure never blocks the Android APK. The .ipa
  # it produces is UNSIGNED: iOS won't install it directly. Sign and install
  # it from a PC with Sideloadly, using an ordinary Apple ID.
  #
  # macOS runners bill at 10x on private repos. This repo is public, so the
  # minutes are free.
  ios:
    runs-on: macos-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Unpack the source zip
        run: |
          unzip -n tv-remote-repo.zip
          echo "--- files now present ---"
          ls -R lib tool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Guard against building the wrong app
        run: |
          test -f lib/main.dart || { echo "::error::lib/main.dart missing"; exit 1; }
          grep -q "TvRemoteApp" lib/main.dart || { echo "::error::lib/main.dart is not the TV remote source"; exit 1; }
          test -f tool/patch_ios.py || { echo "::error::tool/patch_ios.py missing"; exit 1; }
          echo "Source looks right."

      - name: Generate the ios/ project
        run: flutter create --platforms=ios --org pk.bilal --project-name tv_remote .

      - name: Drop the placeholder test
        run: rm -f test/widget_test.dart

      - name: Patch Info.plist
        # Local Network permission. Without it the app silently finds no TVs.
        run: python3 tool/patch_ios.py

      - name: Fetch packages
        run: flutter pub get

      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Inspect what was built
        # If the phone rejects the app as an "invalid file", the answer is
        # almost always in here: wrong architecture, a minimum iOS version
        # above the phone's, or a missing device family.
        continue-on-error: true
        run: |
          APP=build/ios/iphoneos/Runner.app
          echo "--- architectures ---"
          lipo -info "$APP/Runner" || file "$APP/Runner"
          echo "--- key Info.plist values ---"
          for key in CFBundleIdentifier CFBundleExecutable MinimumOSVersion \
                     UIDeviceFamily DTPlatformName CFBundleSupportedPlatforms; do
            printf '%-28s ' "$key"
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" 2>/dev/null || echo "(absent)"
          done
          echo "--- frameworks ---"
          ls "$APP/Frameworks" 2>/dev/null || echo "(none)"

      - name: Wrap it as an .ipa
        # An .ipa is just a zip with the .app inside a Payload folder — but
        # how that zip is made matters more than it looks.
        #
        # macOS attaches extended attributes to files, and `zip` faithfully
        # stores them as AppleDouble "._" entries and a __MACOSX folder.
        # Those survive into the archive, and an iPhone rejects the result
        # as an invalid file. `xattr -cr` strips them at the source and
        # `-X` stops zip writing any more.
        #
        # ditto is used instead of cp -R because it copies bundles exactly,
        # symlinks and permissions included.
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app

          xattr -cr "$APP"
          find "$APP" -name '.DS_Store' -delete

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" build/ipa/Payload/Runner.app

          cd build/ipa
          zip -qr -X --symlinks tv-remote-unsigned.ipa Payload

          echo "--- archive contents (first 25 entries) ---"
          unzip -l tv-remote-unsigned.ipa | head -25
          echo "--- checking for junk that breaks installation ---"
          if unzip -l tv-remote-unsigned.ipa | grep -E '__MACOSX|/\._'; then
            echo "::error::Resource-fork entries made it into the .ipa"
            exit 1
          fi
          echo "Clean."
          ls -lh tv-remote-unsigned.ipa

      - name: Upload the .ipa to this run
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-ipa
          path: build/ipa/tv-remote-unsigned.ipa
          if-no-files-found: error

      - name: How to install it
        run: |
          echo "::notice::Unsigned .ipa built. Download it from this run's Artifacts, then sign and install with Sideloadly on your PC."
